name: BINAIUI PWA checks

on:
  push:
    branches: [binaiui-mobile-pwa]
    paths:
      - 'docs/**'
      - 'qa/**'
      - '.github/workflows/pwa-check.yml'
      - 'binaiui/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'docs/**'
      - 'qa/**'
      - '.github/workflows/pwa-check.yml'
      - 'binaiui/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static app, Chromium, WebKit and original core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original Python core
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Install browser test dependencies
        working-directory: qa
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        working-directory: qa
        run: npx playwright install --with-deps chromium webkit
      - name: Run mobile PWA checks
        working-directory: qa
        run: npm test
      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaiui-browser-results
          path: |
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: warn
          retention-days: 14
