name: BINAIUI expanded systems
on:
  push:
    paths:
      - "binaiui/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/expansion-tests.yml"
  pull_request:
    paths:
      - "binaiui/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/expansion-tests.yml"
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q binaiui tools
