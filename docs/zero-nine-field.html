<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070411"><title>0909090909 →</title>
<style>
html,body{height:100%;margin:0;background:#06051b;color:#fff;font-family:system-ui}
main{height:100svh;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;border:0}
nav{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
display:flex;align-items:center;gap:16px;background:#06051bcc;border:1px solid #60567c66;border-radius:999px;padding:7px 13px}
button,input{border:0;background:none;color:#fff;font:700 19px monospace}
button{min-width:44px;min-height:44px}input{width:64px;text-align:center;outline:none}
</style></head>
<body><main><canvas id="ocean" aria-label="0 9 0 9 strictly forward open ocean" role="img"></canvas>
<nav><input id="seed" aria-label="Seed" type="number" value="9" inputmode="numeric">
<button id="next" aria-label="Generate next forward field">9 ↗</button>
<button id="export" aria-label="Export PNG">↗</button></nav></main>
<script src="./zero-nine-ocean.js"></script>
<script>
const c=document.querySelector('canvas'),s=document.querySelector('#seed');
function update(){window.BINAIUI_ZERO_NINE.draw(c,Number(s.value)||9)}
document.querySelector('#next').onclick=()=>{s.value=Number(s.value)+1;update()};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='09-forward-'+s.value+'.png';a.click()};
s.onchange=update;addEventListener('resize',update);update();
</script></body></html>
